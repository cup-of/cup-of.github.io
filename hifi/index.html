<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiFi Arts Co. — San Diego</title>
    <meta
      name="description"
      content="HiFi Arts Co. — art workshops and community in San Diego, California."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Custom frog cursor (follows the mouse; swapped in script.js) -->
    <div class="frog-cursor" id="frogCursor" aria-hidden="true"></div>

    <!-- ============ HEADER ============ -->
    <header class="site-header" id="top">
      <!-- header.png contains the teal bg, the HiFi Arts Co. logo, and the wave -->
      <div class="site-header__sparkles" aria-hidden="true"></div>

      <img
        class="site-header__ostrich"
        src="assets/ostrich-blinking.gif"
        alt="HiFi Arts Co. ostrich mascot"
      />

      <div class="site-header__quote" aria-hidden="true"></div>

      <img
        class="site-header__magnifier"
        src="assets/magnifying-glass.gif"
        alt=""
        aria-hidden="true"
      />

      <!-- ============ NAV ============ -->
      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
          <li><a href="#about">About Us</a></li>
          <li><a href="#calendar">Workshop Calendar</a></li>
          <li><a href="#contact">Contact Us</a></li>
          <li><a href="#mailing">Mailing List</a></li>
        </ul>
      </nav>
    </header>

    <!-- ============ CONTENT ============ -->
    <main class="content">
      <section class="section section--about" id="about">
        <div class="container">
          <h2 class="section__title">About Us</h2>
          <p class="section__body">Placeholder — about the studio.</p>
        </div>
      </section>

      <section class="section section--calendar" id="calendar">
        <div class="container">
          <h2 class="section__title">Workshop Calendar</h2>
          <p class="section__body">Placeholder — upcoming workshops.</p>
        </div>
      </section>

      <section class="section section--contact" id="contact">
        <div class="container">
          <h2 class="section__title">Contact Us</h2>
          <p class="section__body">Placeholder — how to reach us.</p>
        </div>
      </section>

      <section class="section section--mailing" id="mailing">
        <div class="container">
          <h2 class="section__title">Mailing List</h2>
          <p class="section__body">Placeholder — sign up form.</p>
        </div>
      </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <!-- footer.png contains the wave, address, and copyright -->
    <footer class="site-footer">
      <img
        class="site-footer__img"
        src="assets/footer.png"
        alt="HiFi Arts Co. — 4586 Park Boulevard, San Diego, California 92116"
      />
    </footer>

    <script src="script.js"></script>
  </body>
</html>
